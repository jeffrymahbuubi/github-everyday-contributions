# Deployed 2026-11-13 via the Cloudflare dashboard (not wrangler); this file
# mirrors the live config. Keep both in sync if either changes.
name = "daily-checkin-trigger"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = false   # no public URL; cron-only

[triggers]
# UTC, offset from the GitHub slots (00:07, 03:37, 07:07, 11:37, 22:30).
crons = ["15 2 * * *", "15 9 * * *", "15 16 * * *"]

[observability]
enabled = true
